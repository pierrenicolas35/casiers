<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Casiers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <!-- Global Loading Overlay -->
    <div id="global-loading-overlay" class="modal show">
        <div class="modal-content" style="text-align: center;">
            <h2>Chargement des données...</h2>
            <div class="spinner"></div>
        </div>
    </div>

    <header>
        <h1>Gestion des Casiers du Vestiaire</h1>
    </header>

    <main>
        <div id="svg-container" class="svg-container">
            <!-- SVG will be loaded here -->
        </div>


        <button id="legend-btn" class="btn btn-secondary floating-legend-btn">Voir la Légende</button>

        <!-- Modal for legend -->
        <div id="legend-modal" class="modal">
            <div class="modal-content">
                <span class="close-button legend-close-button">&times;</span>
                <h2>Légende</h2>
                <div class="legend-modal-body" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
                    <div class="legend-item"><span class="color-box libre"></span> Libre (Vert)</div>
                    <div class="legend-item"><span class="color-box occupe"></span> Occupé (Rouge)</div>
                    <div class="legend-item"><span class="color-box inconnu"></span> Inconnu (Orange)</div>
                    <div class="legend-item"><span class="color-box undef"></span> Non renseigné (Blanc)</div>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal for editing locker -->
    <div id="locker-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title">Modifier le Casier</h2>

            <!-- View when locker is occupied -->
            <div id="occupied-view" style="display: none;">
                <div class="form-group">
                    <p style="font-size: 1.1rem; margin-bottom: 1.5rem; text-align: center;">
                        Ce casier appartient à : <br>
                        <strong id="display-occupant-name" style="font-size: 1.5rem; color: var(--text-color);"></strong>
                    </p>
                </div>
                <button type="button" id="release-button" class="btn btn-release">🔓 Libérer le casier</button>
                <button type="button" id="edit-button" class="btn btn-secondary">Modifier les informations</button>
            </div>

            <!-- View for editing locker -->
            <form id="locker-form" style="display: none;">
                <input type="hidden" id="locker-id" name="locker-id">

                <div class="form-group">
                    <label for="locker-status">Statut du casier :</label>
                    <select id="locker-status" name="locker-status" required>
                        <option value="">-- Sélectionner --</option>
                        <option value="Libre">Libre</option>
                        <option value="Occupé">Occupé</option>
                    </select>
                </div>

                <div id="occupant-section" style="display: none;">
                    <div class="form-group">
                        <label for="occupant-name">Nom de l'occupant :</label>
                        <input type="text" id="occupant-name" name="occupant-name">
                        <div class="checkbox-group">
                            <input type="checkbox" id="occupant-unknown" name="occupant-unknown">
                            <label for="occupant-unknown">Inconnu</label>
                        </div>
                    </div>
                </div>

                <button type="submit" id="save-button" class="btn btn-primary">Enregistrer</button>
                <div id="loading-spinner" class="spinner" style="display: none;"></div>
                <div id="message-area" class="message"></div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
